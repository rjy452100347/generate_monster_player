[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maplestory-classic-dataset-generator"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "UnityPy==1.25.3",
  "Pillow==11.3.0",
  "PyYAML==6.0.2",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
]

[tool.setuptools.packages.find]
include = ["classic_dataset*"]
